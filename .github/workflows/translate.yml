name: Reverend Insanity Auto-Translator 24/7

on:
  workflow_dispatch:
    inputs:
      start_chapter:
        description: 'رقم فصل البداية'
        required: false
        default: '1'
      end_chapter:
        description: 'رقم فصل النهاية'
        required: false
        default: '2334'
      scrape_delay:
        description: 'تأخير السحب بالثواني لمنع الحظر'
        required: false
        default: '1.5'
      translate_delay:
        description: 'تأخير الترجمة بالثواني'
        required: false
        default: '0.5'
  schedule:
    # يعمل تلقائياً كل ساعة لمتابعة السحب والترجمة
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # حتى 6 ساعات متواصلة

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Pipeline (Scrape All First, Then Translate All)
        run: |
          START_VAL="${{ github.event.inputs.start_chapter }}"
          END_VAL="${{ github.event.inputs.end_chapter }}"
          S_DELAY="${{ github.event.inputs.scrape_delay }}"
          T_DELAY="${{ github.event.inputs.translate_delay }}"

          START_ARG=${START_VAL:+--start $START_VAL}
          END_ARG=${END_VAL:+--end $END_VAL}
          S_DELAY_ARG=${S_DELAY:+--scrape-delay $S_DELAY}
          T_DELAY_ARG=${T_DELAY:+--delay $T_DELAY}

          echo "Running two-phase pipeline with 15 parallel workers..."
          python -u main.py $START_ARG $END_ARG $S_DELAY_ARG --engine fast --workers 15

      - name: Commit and Push Translated Chapters
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git pull --rebase origin main || true
          git add output/
          git commit -m "Auto-update: Scraped & Translated chapters $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          git push origin main || echo "Push failed or nothing to push"
