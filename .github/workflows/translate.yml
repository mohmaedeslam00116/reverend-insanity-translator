name: Reverend Insanity Parallel Translator

on:
  workflow_dispatch:
    inputs:
      start_chapter:
        description: 'رقم فصل البداية'
        required: false
        default: '1'
      end_chapter:
        description: 'رقم فصل النهاية'
        required: false
        default: '2334'
      workers:
        description: 'عدد المسارات المتوازية (Threads)'
        required: false
        default: '20'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run High-Speed Parallel Translator
        run: |
          START_VAL="${{ github.event.inputs.start_chapter || '1' }}"
          END_VAL="${{ github.event.inputs.end_chapter || '2334' }}"
          WORKERS_VAL="${{ github.event.inputs.workers || '20' }}"

          echo "Launching Parallel Translation with $WORKERS_VAL workers for chapters $START_VAL to $END_VAL..."
          python -u parallel_translator.py --start $START_VAL --end $END_VAL --workers $WORKERS_VAL
          python compile_novel.py

      - name: Commit and Push Translated Chapters
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git pull --rebase origin main || true
          git add output/
          git commit -m "Auto-update: Completed parallel translations $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          git push origin main || echo "Push failed or nothing to push"
