name: 💎 Gemini Flash Lite Multi-Key Translator

on:
  workflow_dispatch:
    inputs:
      novel:
        description: 'Novel Slug (معرف الرواية مثل reverend-insanity أو shadow-slave)'
        required: true
        default: 'reverend-insanity'
      model:
        description: 'Gemini Model'
        required: true
        default: 'gemini-2.5-flash'
        type: choice
        options:
          - 'gemini-2.5-flash'
          - 'gemini-2.0-flash'
          - 'gemini-1.5-flash'
      start_chapter:
        description: 'Start Chapter (فصل البداية)'
        required: false
        default: '1'
      end_chapter:
        description: 'End Chapter (فصل النهاية)'
        required: false
        default: '100'
      workers:
        description: 'Parallel Threads (عدد المسارات: 5 لكل مفتاحين)'
        required: false
        default: '5'
      overwrite:
        description: 'Overwrite & Clean Old (استبدال الترجمة القديمة)'
        type: boolean
        required: false
        default: true
      custom_keys:
        description: 'Gemini API Keys (المفاتيح مفصولة بفواصل أو مسافات - اختياري)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  gemini_translation:
    name: 💎 Gemini Flash Lite Literary Translation
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 🚀 Run Gemini Multi-Key Pipeline
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEYS: "${{ secrets.GEMINI_API_KEYS || secrets.GEMINI_API_KEY || github.event.inputs.custom_keys }}"
        run: |
          OVERWRITE_FLAG=""
          if [ "${{ github.event.inputs.overwrite }}" = "true" ]; then
            OVERWRITE_FLAG="--overwrite"
          fi
          python gemini_novel_translator.py \
            --novel "${{ github.event.inputs.novel || 'reverend-insanity' }}" \
            --model "${{ github.event.inputs.model || 'gemini-2.0-flash-lite-preview-02-05' }}" \
            --keys "$GEMINI_API_KEYS" \
            --start ${{ github.event.inputs.start_chapter || '1' }} \
            --end ${{ github.event.inputs.end_chapter || '100' }} \
            --workers ${{ github.event.inputs.workers || '5' }} \
            $OVERWRITE_FLAG

      - name: 💾 Commit & Push Translated Chapters
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add novels/${{ github.event.inputs.novel || 'reverend-insanity' }}/
          if git diff --staged --quiet; then
            echo "No new chapters to commit."
          else
            git commit -m "feat(gemini): translate chapters ${{ github.event.inputs.start_chapter }}-${{ github.event.inputs.end_chapter }} of ${{ github.event.inputs.novel }} via Gemini Flash Lite [skip ci]"
            git push origin main
          fi
