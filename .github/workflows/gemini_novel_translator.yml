name: 💎 Gemini Flash Lite Multi-Key Translator

on:
  workflow_dispatch:
    inputs:
      novel:
        description: 'Novel Slug (معرف الرواية مثل reverend-insanity أو shadow-slave)'
        required: true
        default: 'reverend-insanity'
      model:
        description: 'Gemini Model'
        required: true
        default: 'gemini-3.5-flash-lite'
        type: choice
        options:
          - 'gemini-3.5-flash-lite'
          - 'gemini-3.5-flash'
          - 'gemini-2.5-flash'
          - 'gemini-2.0-flash'
      start_chapter:
        description: 'Start Chapter (فصل البداية)'
        required: false
        default: '1'
      end_chapter:
        description: 'End Chapter (فصل النهاية)'
        required: false
        default: '1900'
      workers:
        description: 'Parallel Threads (عدد المسارات المتوازية)'
        required: false
        default: '6'
      batch_size:
        description: 'Batch Size for Git Push (حجم الدفعة للرفع الدوري)'
        required: false
        default: '100'
      overwrite:
        description: 'Overwrite & Clean Old (استبدال الترجمة القديمة)'
        type: boolean
        required: false
        default: true
      custom_keys:
        description: 'Gemini API Keys (المفاتيح مفصولة بفواصل أو مسافات - اختياري)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  gemini_translation:
    name: 💎 Gemini Flash Lite Literary Translation
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: ⚙️ Configure Git for Auto-Commit Batches
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Run Gemini Multi-Key Unstoppable Pipeline
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEYS: "${{ secrets.GEMINI_API_KEYS || secrets.GEMINI_API_KEY || github.event.inputs.custom_keys }}"
        run: |
          OVERWRITE_FLAG=""
          if [ "${{ github.event.inputs.overwrite }}" = "true" ]; then
            OVERWRITE_FLAG="--overwrite"
          fi
          python gemini_novel_translator.py \
            --novel "${{ github.event.inputs.novel || 'reverend-insanity' }}" \
            --model "${{ github.event.inputs.model || 'gemini-3.5-flash-lite' }}" \
            --keys "$GEMINI_API_KEYS" \
            --start ${{ github.event.inputs.start_chapter || '1' }} \
            --end ${{ github.event.inputs.end_chapter || '1900' }} \
            --workers ${{ github.event.inputs.workers || '6' }} \
            --batch-size ${{ github.event.inputs.batch_size || '100' }} \
            $OVERWRITE_FLAG

      - name: 💾 Final Commit & Push Remaining
        if: always()
        run: |
          git add novels/${{ github.event.inputs.novel || 'reverend-insanity' }}/
          if git diff --staged --quiet; then
            echo "All batches already committed and pushed."
          else
            git commit -m "feat(gemini): final sync for ${{ github.event.inputs.novel }} (chapters ${{ github.event.inputs.start_chapter }}-${{ github.event.inputs.end_chapter }}) [skip ci]" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi
